map $http_upgrade $xiaofeiyu_connection_upgrade {
    default upgrade;
    '' close;
}
log_format xiaofeiyu '$remote_addr $request_method $uri $status';
limit_req_zone $binary_remote_addr zone=xiaofeiyu_api:1m rate=3r/s;
server {
    listen 80 default_server;
    server_name 47.117.142.184;
    root /var/lib/xiaofeiyu/acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://47.117.142.184$request_uri; }
}
server {
    listen 443 ssl;
    server_name 47.117.142.184;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/xiaofeiyu-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaofeiyu-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XiaofeiyuSSL:1m;
    client_max_body_size 6m;
    access_log /var/log/nginx/xiaofeiyu.access.log xiaofeiyu;
    location /xiaozhi/v1/ {
        limit_req zone=xiaofeiyu_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xiaofeiyu_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /xiaozhi/ota/ {
        limit_req zone=xiaofeiyu_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location = /mcp/vision/explain {
        limit_req zone=xiaofeiyu_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
