name: Build LCKFB Firmware

# 只编译立创·实战派 ESP32-S3（lckfb/szpi-esp32s3，变体 lichuang-dev）。
# 用途：云端编译出应用镜像和独立 assets 镜像。OTA 使用 xiaozhi.bin；
# merged-binary.bin 不作为 OTA 交付物。
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build lckfb/szpi-esp32s3 (lichuang-dev)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run firmware behavior tests
        shell: bash
        run: |
          command -v g++ || (apt-get update && apt-get install -y g++)
          g++ --version
          source "$IDF_PATH/export.sh"
          python -m pip install --no-deps --target /tmp/xiaofeiyu-hostdeps esp-idf-nvs-partition-gen==0.3.0
          export PYTHONPATH="/tmp/xiaofeiyu-hostdeps"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python -m unittest discover -s scripts/tests -p 'test_connection_recovery*.py' -v
          python -m unittest discover -s scripts/tests -p 'test_touch_gesture_runner.py' -v
          python -m unittest discover -s scripts/tests -p 'test_ui_sound_arbiter_runner.py' -v
          python -m unittest discover -s scripts/tests -p 'test_settings_runner.py' -v
          python -m unittest discover -s scripts/tests -p 'test_camera_tools.py' -v
          python -m unittest discover -s scripts/tests -p 'test_vision_refresh.py' -v
          python -m unittest discover -s scripts/tests -p 'test_interaction_overlay.py' -v
          python -m unittest discover -s scripts/tests -p 'test_clean_emote_events.py' -v
          python -m unittest discover -s scripts/tests -p 'test_emote_pack.py' -v
          python -m unittest discover -s scripts/tests -p 'test_provision_device_nvs.py' -v
          python -m unittest discover -s scripts/tests -p 'test_tls_clock.py' -v
          python -m unittest discover -s scripts/tests -p 'test_optimize_eaf.py' -v
          python -m unittest discover -s scripts/tests -p 'test_emote_assets_dependencies.py' -v
          python -m unittest discover -s scripts/tests -p 'test_touch_clips_sync.py' -v
          python scripts/verify_eaf_assets.py

      - name: Build firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          python scripts/build.py lckfb/szpi-esp32s3 --name lichuang-dev --wake-word disabled
          grep -n "CONFIG_OTA_URL" sdkconfig
          grep -n "CONFIG_MBEDTLS_HAVE_TIME_DATE" sdkconfig
          grep -n "CONFIG_MMAP_FILE_NAME_LENGTH" sdkconfig

      - name: Record resolved WebSocket transport evidence
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path
          lock = Path("dependencies.lock")
          lock_text = lock.read_text()
          match = re.search(r"(?m)^  78/esp-ml307:\s*$([\s\S]*?)(?=^  \S|\Z)", lock_text)
          assert match, "resolved esp-ml307 missing from dependency lock"
          version = re.search(r"(?m)^    version:\s*(.+)$", match.group(1))
          assert version, "resolved esp-ml307 version missing"
          paths = list(Path("managed_components").glob("*esp-ml307*/src/web_socket.cc"))
          assert len(paths) == 1, "expected exactly one compiled esp-ml307 WebSocket source"
          source = paths[0]
          body = source.read_text()
          start = body.find("case 0x9:")
          end = body.find("break;", start)
          assert start >= 0 and end > start, "Ping handler unavailable"
          excerpt = body[start:end + len("break;")]
          assert "SendControlFrame(0xA," in excerpt, "resolved client does not prove automatic Pong"
          report = {
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "component": "78/esp-ml307",
              "resolved_version": version.group(1).strip(),
              "lock_sha256": hashlib.sha256(lock.read_bytes()).hexdigest(),
              "websocket_source": str(source),
              "websocket_source_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
              "automatic_pong_source_confirmed": True,
              "ping_handler_excerpt": excerpt,
              "hardware_pong_test": "pending user-approved flashing",
          }
          target = Path("build/transport-evidence.json")
          target.write_text(json.dumps(report, indent=2) + "\n")
          print(target.read_text())
          PY

      - name: Verify build outputs
        shell: bash
        run: |
          test -s build/xiaozhi.bin
          test -s build/expression_assets.bin
          test "$(stat -c%s build/expression_assets.bin)" -le 8388608
          python scripts/verify_emote_pack.py build/expression_assets.bin --board-assets
          sha256sum build/xiaozhi.bin build/expression_assets.bin > build/sha256sums.txt
          VER=$(grep -oE 'PROJECT_VER "[0-9.]+"' CMakeLists.txt | grep -oE '[0-9.]+')
          COMMIT=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --short HEAD)
          test -n "$VER"
          test -n "$COMMIT"
          printf '%s\n' \
            'app     : 0x20000  xiaozhi.bin' \
            'assets  : 0x800000 expression_assets.bin' \
            'boot    : 0x0      bootloader/bootloader.bin' \
            'table   : 0x8000   partition_table/partition-table.bin' \
            'ota_data: 0xd000   ota_data_initial.bin' \
            "version : $VER" \
            "commit  : $COMMIT" > build/flash-args.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi-lckfb-lichuang-dev
          path: |
            build/xiaozhi.bin
            build/expression_assets.bin
            build/sha256sums.txt
            build/flash-args.txt
            build/transport-evidence.json
          if-no-files-found: error
