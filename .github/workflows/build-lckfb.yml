name: Build LCKFB Firmware

# 只编译立创·实战派 ESP32-S3（lckfb/szpi-esp32s3，变体 lichuang-dev）。
# 用途：云端编译出应用镜像和独立 assets 镜像。OTA 使用 xiaozhi.bin；
# merged-binary.bin 不作为 OTA 交付物。
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build lckfb/szpi-esp32s3 (lichuang-dev)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run firmware behavior tests
        shell: bash
        run: |
          command -v g++ || (apt-get update && apt-get install -y g++)
          g++ --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python -m unittest discover -s scripts/tests -p 'test_touch_gesture_runner.py' -v
          python -m unittest discover -s scripts/tests -p 'test_settings_runner.py' -v
          python -m unittest discover -s scripts/tests -p 'test_camera_tools.py' -v
          python -m unittest discover -s scripts/tests -p 'test_vision_refresh.py' -v
          python -m unittest discover -s scripts/tests -p 'test_interaction_overlay.py' -v
          python -m unittest discover -s scripts/tests -p 'test_optimize_eaf.py' -v
          python -m unittest discover -s scripts/tests -p 'test_emote_assets_dependencies.py' -v
          python scripts/verify_eaf_assets.py

      - name: Build firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          python scripts/build.py lckfb/szpi-esp32s3 --name lichuang-dev --wake-word disabled
          grep -n "CONFIG_OTA_URL" sdkconfig

      - name: Verify build outputs
        shell: bash
        run: |
          test -s build/xiaozhi.bin
          test -s build/expression_assets.bin
          test "$(stat -c%s build/expression_assets.bin)" -le 8388608
          sha256sum build/xiaozhi.bin build/expression_assets.bin > build/sha256sums.txt
          VER=$(grep -oE 'PROJECT_VER "[0-9.]+"' CMakeLists.txt | grep -oE '[0-9.]+')
          COMMIT=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --short HEAD)
          test -n "$VER"
          test -n "$COMMIT"
          printf '%s\n' \
            'app     : 0x20000  xiaozhi.bin' \
            'assets  : 0x800000 expression_assets.bin' \
            'boot    : 0x0      bootloader/bootloader.bin' \
            'table   : 0x8000   partition_table/partition-table.bin' \
            'ota_data: 0xd000   ota_data_initial.bin' \
            "version : $VER" \
            "commit  : $COMMIT" > build/flash-args.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi-lckfb-lichuang-dev
          path: |
            build/xiaozhi.bin
            build/expression_assets.bin
            build/sha256sums.txt
            build/flash-args.txt
          if-no-files-found: error
